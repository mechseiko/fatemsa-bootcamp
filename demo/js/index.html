<!DOCTYPE html>
<!-- FILE: 03-js/index.html | SESSIONS 3 and 4 | TEACHES: the HTML skeleton for the JavaScript demos. The logic is in script.js. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Demos</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; font-size: 18px; background: #f6f8fc; color: #111; padding: 32px; }
    /* THEME TOGGLE: JavaScript adds the class "dark" to the body. These rules then change the colours. */
    body.dark { background: #111; color: #f1f1f1; }
    section { background: #fff; color: #111; border: 1px solid #d5dae3; border-radius: 12px; padding: 18px 20px; margin: 16px 0; max-width: 640px; }
    h2 { margin-top: 0; color: #0B5FFF; }
    button { font-size: 16px; padding: 8px 14px; border: 0; border-radius: 8px; background: #0B5FFF; color: #fff; cursor: pointer; }
    pre { background: #111; color: #9fe3ff; padding: 12px; border-radius: 8px; min-height: 40px; white-space: pre-wrap; }
    li.done { text-decoration: line-through; color: #888; }
    textarea, input { font-size: 16px; padding: 6px; max-width: 100%; }
  </style>
</head>
<body>
  <h1>JavaScript Demos</h1>
  <button id="theme-btn">Toggle dark mode</button>

  <section><h2>1. JS basics</h2>
    <button id="basics-btn">Run basics</button>
    <pre id="basics-out">Click the button...</pre></section>

  <section><h2>2. Click counter</h2>
    <p>Count: <strong id="count">0</strong></p>
    <button id="count-btn">Add one</button></section>

  <section><h2>3. Live character counter</h2>
    <textarea id="text-box" rows="3" cols="40" placeholder="Type here..."></textarea>
    <p id="char-info">0 / 100</p></section>

  <section><h2>4. Mini to-do list</h2>
    <input id="todo-input" placeholder="New task">
    <button id="todo-add">Add</button>
    <ul id="todo-list"></ul></section>

  <section><h2>5. Live weather in Ibadan (API)</h2>
    <button id="weather-btn">Get temperature</button>
    <p id="weather-out"></p></section>

  <!-- defer = wait until the whole page is loaded, THEN run the script. -->
  <script src="script.js" defer></script>
</body>
</html>
